<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23256abf'/><rect x='10' y='6' width='12' height='20' rx='3' fill='none' stroke='white' stroke-width='2'/><circle cx='16' cy='22' r='1.5' fill='white'/></svg>" />
    <title>ERP Assistência</title>
    <script>
      // Aplica o tema salvo antes da pintura (evita flash)
      try {
        const t = localStorage.getItem('erp.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
